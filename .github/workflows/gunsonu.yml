name: bist-gunsonu
on:
  schedule:
    - cron: "20 15 * * 1-5"   # 18:20 TRT, canlı takip bittikten sonra
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bist-gunsonu
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas requests
      - run: python gunsonu.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Öğrenilen filtreleri sakla
        if: always()
        run: |
          if [ -f ogrenilen.json ]; then
            git config user.name "bist-bot"
            git config user.email "bist-bot@users.noreply.github.com"
            git add ogrenilen.json
            if ! git diff --staged --quiet; then
              git commit -m "ogrenilen filtreler"
              git pull --rebase
              git push
            fi
          fi
