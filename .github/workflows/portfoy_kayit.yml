name: bist-portfoy-kayit
on:
  schedule:
    - cron: "20 15 * * 1-5"   # 18:20 TRT, her iş günü kapanıştan sonra
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bist-portfoy-kayit
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas requests cryptography
      - run: python portfoy_kayit.py
        env:
          PORTFOY: ${{ secrets.PORTFOY }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Şifreli defteri sakla
        if: always()
        run: |
          if [ -f portfoy_defter.enc ]; then
            git config user.name "bist-bot"
            git config user.email "bist-bot@users.noreply.github.com"
            git add portfoy_defter.enc
            if ! git diff --staged --quiet; then
              git commit -m "defter"
              git pull --rebase
              git push
            fi
          fi
