name: bist-dipler
on:
  schedule:
    - cron: "30 15 * * 1-5"   # 18:30 TRT, kapanıştan sonra
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bist-dipler
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas requests
      - run: python dipler.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Liste kayıtlarını sakla
        if: always()
        run: |
          if [ -f dip_log.csv ]; then
            git config user.name "bist-bot"
            git config user.email "bist-bot@users.noreply.github.com"
            git add dip_log.csv
            if ! git diff --staged --quiet; then
              git commit -m "dip listesi"
              git pull --rebase
              git push
            fi
          fi
