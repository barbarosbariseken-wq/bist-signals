name: bist-portfoy
on:
  schedule:
    - cron: "*/15 7-14 * * 1-5"   # 10:00-17:45 TRT, her 15 dk
    - cron: "0 15 * * 1-5"        # 18:00 TRT
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bist-portfoy
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas requests cryptography
      - run: python portfoy.py
        env:
          PORTFOY: ${{ secrets.PORTFOY }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Kilometre taşı kaydını sakla
        if: always()
        run: |
          if [ -f portfoy_hedef.enc ]; then
            git config user.name "bist-bot"
            git config user.email "bist-bot@users.noreply.github.com"
            git add portfoy_hedef.enc
            if ! git diff --staged --quiet; then
              git commit -m "hedef"
              for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
            fi
          fi
